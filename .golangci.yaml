version: "2"

linters:
  default: standard
  enable:
    - errorlint # errors.Is / errors.As / %w misuse
    - nolintlint # every //nolint must name a linter and give a reason
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
