version: "2"

linters:
  default: standard
  enable:
    - revive # style: naming, doc comments, receivers
    - errorlint # errors.Is / errors.As / %w misuse
    - bodyclose # unclosed HTTP response bodies
    - nolintlint # every //nolint must name a linter and give a reason
    - sloglint # slog: use *Context methods so ctx-carried attrs are logged
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      context: scope # *Context methods required whenever a ctx is in scope

formatters:
  enable:
    - gofmt
    - goimports
